<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img">
  <title>요청 컨텍스트를 구성하는 입력과 활용 결과</title>
  <desc>사용자 역할, 채널, 서비스, 질문 언어를 요청 컨텍스트로 구성하고 검색 범위와 답변 형식과 답변 언어를 정한다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #16181c; }
    .h { font-size: 14px; font-weight: 600; }
    .t { font-size: 12px; fill: #555b66; }
    .k { font-size: 12px; font-weight: 600; fill: #2f5bea; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#aeb3bb" stroke-width="1.3"/></marker></defs>
  <rect width="640" height="370" fill="#fff"/>
  <text class="h" x="28" y="35">질문 내용과 요청 메타데이터를 함께 사용한다</text>

  <rect x="28" y="70" width="130" height="52" rx="9" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="93" y="92" text-anchor="middle">사용자 역할</text><text class="t" x="93" y="111" text-anchor="middle">고객 · 관리자</text>
  <rect x="28" y="138" width="130" height="52" rx="9" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="93" y="160" text-anchor="middle">채널</text><text class="t" x="93" y="179" text-anchor="middle">메신저 종류</text>
  <rect x="28" y="206" width="130" height="52" rx="9" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="93" y="228" text-anchor="middle">서비스</text><text class="t" x="93" y="247" text-anchor="middle">병원 · 상품</text>
  <rect x="28" y="274" width="130" height="52" rx="9" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="93" y="296" text-anchor="middle">질문 언어</text><text class="t" x="93" y="315" text-anchor="middle">자동 판별</text>

  <path d="M158 96 H226 M158 164 H210 Q226 164 226 180 V190 M158 232 H210 Q226 232 226 216 V206 M158 300 H226" fill="none" stroke="#aeb3bb" marker-end="url(#a)"/>

  <rect x="230" y="132" width="180" height="116" rx="12" fill="#f5f7fe" stroke="#2f5bea"/>
  <text class="k" x="320" y="162" text-anchor="middle">REQUEST CONTEXT</text>
  <text class="h" x="320" y="189" text-anchor="middle">요청별 컨텍스트</text>
  <text class="t" x="320" y="216" text-anchor="middle">검색과 답변 생성에 함께 전달</text>

  <path d="M410 190 H454" stroke="#aeb3bb" marker-end="url(#a)"/>
  <rect x="458" y="70" width="154" height="70" rx="9" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="535" y="99" text-anchor="middle">검색 범위</text><text class="t" x="535" y="121" text-anchor="middle">테넌트 · 권한</text>
  <rect x="458" y="150" width="154" height="70" rx="9" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="535" y="179" text-anchor="middle">답변 형식</text><text class="t" x="535" y="201" text-anchor="middle">채널별 길이 · 어투</text>
  <rect x="458" y="230" width="154" height="70" rx="9" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="535" y="259" text-anchor="middle">답변 언어</text><text class="t" x="535" y="281" text-anchor="middle">질문 언어 유지</text>
</svg>
