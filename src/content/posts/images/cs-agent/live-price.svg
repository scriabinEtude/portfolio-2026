<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img">
  <title>일반 안내와 변경 가능한 값의 조회 경로 분리</title>
  <desc>일반 안내는 테넌트별 벡터 검색으로 찾고 가격과 이벤트는 RDB와 Elasticsearch의 현재 값을 조회해 답변 생성에 합친다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #16181c; }
    .h { font-size: 14px; font-weight: 600; }
    .t { font-size: 12px; fill: #555b66; }
    .k { font-size: 12px; font-weight: 600; fill: #2f5bea; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#aeb3bb" stroke-width="1.3"/></marker></defs>
  <rect width="640" height="350" fill="#fff"/>
  <rect x="210" y="26" width="220" height="54" rx="10" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="320" y="49" text-anchor="middle">고객 질문</text>
  <text class="t" x="320" y="68" text-anchor="middle">어떤 종류의 정보가 필요한가?</text>

  <path d="M320 80 V108 H164 V132 M320 108 H476 V132" fill="none" stroke="#aeb3bb" marker-end="url(#a)"/>

  <rect x="32" y="136" width="264" height="112" rx="12" fill="#f5f7fe" stroke="#dce3fa"/>
  <text class="k" x="52" y="164">일반 안내</text>
  <text class="h" x="52" y="190">테넌트별 벡터 검색</text>
  <text class="t" x="52" y="213">절차 · 이용 방법 · 준비 서류</text>
  <text class="t" x="52" y="232">관련 문서와 근거 조각 반환</text>

  <rect x="344" y="136" width="264" height="112" rx="12" fill="#fff8ee" stroke="#eadbc3"/>
  <text class="k" x="364" y="164" fill="#9a5b00">변경 가능한 값</text>
  <text class="h" x="364" y="190">원본 데이터 조회</text>
  <text class="t" x="364" y="213">RDB · Elasticsearch</text>
  <text class="t" x="364" y="232">현재 가격 · 진행 중 이벤트 반환</text>

  <path d="M164 248 V278 H302 M476 248 V278 H338" fill="none" stroke="#aeb3bb" marker-end="url(#a)"/>
  <rect x="218" y="286" width="204" height="42" rx="10" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="320" y="312" text-anchor="middle">답변 생성에 함께 전달</text>
</svg>
