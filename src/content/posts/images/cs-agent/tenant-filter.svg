<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img">
  <title>테넌트 스코프 필터를 먼저 적용하는 검색 순서</title>
  <desc>전체 벡터 데이터에서 요청의 테넌트 스코프와 일치하는 문서만 남긴 뒤 유사도와 리랭킹으로 결과를 정렬한다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #16181c; }
    .h { font-size: 14px; font-weight: 600; }
    .t { font-size: 12px; fill: #555b66; }
    .k { font-size: 12px; font-weight: 600; fill: #2f5bea; }
  </style>
  <defs><marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#aeb3bb" stroke-width="1.3"/></marker></defs>
  <rect width="640" height="350" fill="#fff"/>
  <text class="h" x="28" y="35">유사도를 계산하기 전에 조회 가능한 테넌트를 제한한다</text>

  <text class="k" x="28" y="75">전체 벡터 데이터</text>
  <rect x="28" y="90" width="180" height="42" rx="8" fill="#eef2fd"/><text class="h" x="48" y="116">병원 A · 문서 01</text>
  <rect x="28" y="140" width="180" height="42" rx="8" fill="#f3f3f5"/><text class="h" x="48" y="166">병원 B · 문서 07</text>
  <rect x="28" y="190" width="180" height="42" rx="8" fill="#eef2fd"/><text class="h" x="48" y="216">병원 A · 문서 12</text>
  <rect x="28" y="240" width="180" height="42" rx="8" fill="#f3f3f5"/><text class="h" x="48" y="266">병원 C · 문서 03</text>

  <line x1="208" y1="186" x2="266" y2="186" stroke="#aeb3bb" marker-end="url(#a)"/>

  <rect x="270" y="115" width="148" height="142" rx="12" fill="#f5f7fe" stroke="#2f5bea"/>
  <text class="k" x="344" y="147" text-anchor="middle">SCOPE FILTER</text>
  <text class="h" x="344" y="178" text-anchor="middle">요청 스코프 = 병원 A</text>
  <line x1="296" y1="196" x2="392" y2="196" stroke="#d4dcf7"/>
  <text class="t" x="344" y="222" text-anchor="middle">B · C 문서는 후보 제외</text>

  <line x1="418" y1="186" x2="460" y2="186" stroke="#aeb3bb" marker-end="url(#a)"/>

  <text class="k" x="464" y="75">검색 후보</text>
  <rect x="464" y="106" width="148" height="62" rx="9" fill="#eef2fd" stroke="#dce3fa"/>
  <text class="h" x="484" y="132">병원 A · 문서 12</text><text class="t" x="484" y="153">리랭킹 1순위</text>
  <rect x="464" y="184" width="148" height="62" rx="9" fill="#eef2fd" stroke="#dce3fa"/>
  <text class="h" x="484" y="210">병원 A · 문서 01</text><text class="t" x="484" y="231">리랭킹 2순위</text>

  <rect x="270" y="294" width="342" height="34" rx="8" fill="#f7f7f9"/>
  <text class="t" x="441" y="316" text-anchor="middle">권한 범위 제한 → 유사도 검색 → 리랭킹</text>
</svg>
