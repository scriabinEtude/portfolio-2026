<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img">
  <title>AIMD에 따른 동시 호출 한도 변화</title>
  <desc>성공이 누적되면 동시 호출 한도가 선형으로 증가하고 429가 발생한 시점에는 30% 감소하는 톱니 모양의 변화다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #16181c; }
    .h { font-size: 15px; font-weight: 600; }
    .t { font-size: 12px; fill: #555b66; }
    .l { font-size: 12px; font-weight: 600; }
  </style>
  <rect width="640" height="340" fill="#fff"/>
  <text class="h" x="28" y="35">성공 시 조금씩 증가하고, 429 발생 시 30% 감소한다</text>
  <text class="t" x="612" y="35" text-anchor="end">동작 원리 개념도</text>

  <line x1="66" y1="278" x2="612" y2="278" stroke="#aeb3bb"/>
  <line x1="66" y1="66" x2="66" y2="278" stroke="#aeb3bb"/>
  <text class="t" x="340" y="316" text-anchor="middle">요청 처리 시간</text>
  <text class="t" x="22" y="172" text-anchor="middle" transform="rotate(-90 22 172)">동시 호출 한도</text>

  <path d="M66 248 L128 222 L190 196 L252 170 L252 202 L318 176 L384 150 L450 124 L450 170 L504 144 L558 118 L612 92"
        fill="none" stroke="#2f5bea" stroke-width="3" stroke-linejoin="round"/>

  <circle cx="252" cy="170" r="5" fill="#c7473a"/>
  <line x1="252" y1="170" x2="252" y2="202" stroke="#c7473a" stroke-width="2"/>
  <text class="l" x="252" y="154" text-anchor="middle" fill="#a4382f">429</text>
  <text class="t" x="262" y="191">30% 감소</text>

  <circle cx="450" cy="124" r="5" fill="#c7473a"/>
  <line x1="450" y1="124" x2="450" y2="170" stroke="#c7473a" stroke-width="2"/>
  <text class="l" x="450" y="108" text-anchor="middle" fill="#a4382f">429</text>
  <text class="t" x="460" y="151">30% 감소</text>

  <path d="M112 231 H180" stroke="#287a55" stroke-width="2"/>
  <path d="M172 225 L184 231 L172 237" fill="none" stroke="#287a55" stroke-width="2"/>
  <text class="l" x="148" y="214" text-anchor="middle" fill="#287a55">100회 성공마다 +1</text>
</svg>
