<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img">
  <title>자리 점유는 작업 단위, 성공·혼잡 신호는 콜 단위</title>
  <desc>작업 한 건이 슬롯 하나를 점유하고 그 안의 여러 API 콜이 각각 성공·혼잡 신호를 보낸다. 작업 단위는 점유 수를, 콜 단위는 한도를 바꾸며 두 값 모두 배치 전체가 공유하는 전역 상태다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #16181c; }
    .h { font-size: 14px; font-weight: 600; }
    .c { font-family: Consolas, "D2Coding", ui-monospace, monospace; font-size: 12px; font-weight: 600; }
    .s { font-size: 11px; fill: #555b66; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#8b929c" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fff"/>

  <text class="h" x="28" y="30">자리는 작업 단위로 잡고, 신호는 콜 단위로 보낸다</text>

  <rect x="28" y="48" width="584" height="76" rx="10" fill="#f7f7f9" stroke="#dcdde2"/>
  <text class="s" x="46" y="70">작업 1건 · 호텔 한 곳 — 슬롯 하나를 잡고 그 안에서 콜 여러 개를 보낸다</text>
  <rect x="46" y="82" width="80" height="28" rx="6" fill="#fff" stroke="#cfd3d9"/>
  <text class="c" x="86" y="101" text-anchor="middle" fill="#2f5bea">acquire</text>
  <rect x="146" y="82" width="62" height="28" rx="6" fill="#eef2fd" stroke="#dce3fa"/>
  <text class="s" x="177" y="101" text-anchor="middle">콜</text>
  <rect x="216" y="82" width="62" height="28" rx="6" fill="#eef2fd" stroke="#dce3fa"/>
  <text class="s" x="247" y="101" text-anchor="middle">콜</text>
  <rect x="286" y="82" width="62" height="28" rx="6" fill="#eef2fd" stroke="#dce3fa"/>
  <text class="s" x="317" y="101" text-anchor="middle">콜</text>
  <text class="s" x="358" y="101">…</text>
  <rect x="380" y="82" width="80" height="28" rx="6" fill="#fff" stroke="#cfd3d9"/>
  <text class="c" x="420" y="101" text-anchor="middle" fill="#2f5bea">release</text>

  <text class="h" x="28" y="152">작업 단위</text>
  <text class="h" x="236" y="152">전역 상태</text>
  <text class="h" x="428" y="152">콜 단위</text>

  <rect x="28" y="164" width="184" height="46" rx="8" fill="#fff" stroke="#cfd3d9"/>
  <text class="c" x="44" y="184" fill="#2f5bea">acquire()</text>
  <text class="s" x="44" y="201">빈자리 없으면 대기</text>

  <rect x="28" y="220" width="184" height="46" rx="8" fill="#fff" stroke="#cfd3d9"/>
  <text class="c" x="44" y="240" fill="#2f5bea">release()</text>
  <text class="s" x="44" y="257">성공·실패와 무관하게 반드시</text>

  <rect x="236" y="164" width="168" height="72" rx="8" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="c" x="252" y="186">점유 수</text>
  <text class="s" x="252" y="206">acquire 에서 +1</text>
  <text class="s" x="252" y="224">release 에서 −1</text>

  <rect x="236" y="256" width="168" height="96" rx="8" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="c" x="252" y="278">한도</text>
  <text class="s" x="252" y="298">연속 성공 N회마다 +1</text>
  <text class="s" x="252" y="316">혼잡 신호에 ×0.7</text>
  <text class="s" x="252" y="334">하한·상한 안에서만</text>

  <rect x="428" y="256" width="184" height="46" rx="8" fill="#f4faf7" stroke="#cfe5da"/>
  <text class="c" x="444" y="276" fill="#226747">onSuccess()</text>
  <text class="s" x="444" y="293">정상 응답</text>

  <rect x="428" y="312" width="184" height="46" rx="8" fill="#fff7f5" stroke="#eccbc6"/>
  <text class="c" x="444" y="332" fill="#9f3329">onThrottle()</text>
  <text class="s" x="444" y="349">429 · 5xx · 타임아웃</text>

  <path d="M212 187 H228" fill="none" stroke="#8b929c" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M212 243 H222 Q230 243 230 231 V222 H228" fill="none" stroke="#8b929c" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M428 279 H412" fill="none" stroke="#287a55" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M428 335 H418 Q410 335 410 323 V314 H412" fill="none" stroke="#c7473a" stroke-width="1.4" marker-end="url(#ar)"/>

  <text class="s" x="28" y="386">한 콜이 낮춘 한도가 배치 전체의 acquire 를 함께 조인다.</text>
</svg>
