<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img">
  <title>가용 동시성과 고정 동시성의 차이</title>
  <desc>운영 트래픽에 따라 배치가 사용할 수 있는 동시성은 달라지지만 고정값 2는 하루 종일 같은 수준을 유지하는 개념도다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #16181c; }
    .h { font-size: 15px; font-weight: 600; }
    .t { font-size: 12px; fill: #555b66; }
    .l { font-size: 12px; font-weight: 600; }
  </style>
  <rect width="640" height="330" fill="#fff"/>
  <text class="h" x="28" y="35">고정값은 트래픽이 적은 시간의 여유 용량을 사용하지 못한다</text>
  <text class="t" x="612" y="35" text-anchor="end">개념도 · 실제 측정치 아님</text>

  <line x1="66" y1="268" x2="610" y2="268" stroke="#aeb3bb"/>
  <line x1="66" y1="66" x2="66" y2="268" stroke="#aeb3bb"/>
  <text class="t" x="338" y="306" text-anchor="middle">시간</text>
  <text class="t" x="22" y="168" text-anchor="middle" transform="rotate(-90 22 168)">배치가 사용할 수 있는 동시성</text>

  <path d="M66 210 C120 218 156 205 198 172 S286 88 352 94 S458 170 500 190 S565 214 610 204 L610 268 L66 268 Z"
        fill="#eef2fd"/>
  <path d="M66 210 C120 218 156 205 198 172 S286 88 352 94 S458 170 500 190 S565 214 610 204"
        fill="none" stroke="#2f5bea" stroke-width="2.5"/>
  <text class="l" x="356" y="82" fill="#2f5bea">시간대별 가용 동시성</text>

  <line x1="66" y1="232" x2="610" y2="232" stroke="#c7473a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="l" x="600" y="222" text-anchor="end" fill="#a4382f">고정 동시성 2</text>

  <path d="M106 232 V210 M152 232 V204 M205 232 V168 M260 232 V120 M318 232 V91 M380 232 V106 M440 232 V155 M494 232 V187 M554 232 V210"
        stroke="#9aaeea" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="252" y="144" width="172" height="42" rx="6" fill="#fff"/>
  <text class="t" x="338" y="161" text-anchor="middle">고정 동시성을 사용했을 때</text>
  <text class="t" x="338" y="178" text-anchor="middle">사용하지 못한 여유 용량</text>
</svg>
