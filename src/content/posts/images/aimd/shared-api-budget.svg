<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img">
  <title>운영 요청과 배치가 공급사 API 호출 한도를 공유하는 구조</title>
  <desc>운영 서비스와 배치 요청이 하나의 공급사 API 한도를 함께 사용하며, 합계가 한도를 넘으면 429 응답이 발생한다.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; fill: #16181c; }
    .h { font-size: 15px; font-weight: 600; }
    .t { font-size: 13px; }
    .s { font-size: 12px; fill: #555b66; }
  </style>
  <rect width="640" height="300" fill="#fff"/>

  <text class="h" x="28" y="35">공급사 API의 호출 한도는 운영 요청과 배치가 함께 사용한다</text>

  <rect x="28" y="68" width="190" height="64" rx="10" fill="#f5f7fe" stroke="#dce3fa"/>
  <text class="h" x="48" y="96">운영 서비스</text>
  <text class="s" x="48" y="117">사용자 요청 · 우선 보호</text>

  <rect x="28" y="166" width="190" height="64" rx="10" fill="#f7f7f9" stroke="#e4e5e9"/>
  <text class="h" x="48" y="194">콘텐츠 배치</text>
  <text class="s" x="48" y="215">약 800만 회 호출</text>

  <path d="M218 100 H286" fill="none" stroke="#2f5bea" stroke-width="2"/>
  <path d="M218 198 H252 Q270 198 270 180 V132 Q270 116 286 116" fill="none" stroke="#777d87" stroke-width="2"/>
  <path d="M278 94 L290 100 L278 106" fill="none" stroke="#2f5bea" stroke-width="2"/>
  <path d="M278 110 L290 116 L278 122" fill="none" stroke="#777d87" stroke-width="2"/>

  <rect x="290" y="82" width="168" height="78" rx="12" fill="#fff" stroke="#cfd3d9"/>
  <text class="h" x="374" y="111" text-anchor="middle">공급사 API</text>
  <text class="t" x="374" y="137" text-anchor="middle">공유 호출 한도</text>

  <path d="M458 121 H518" fill="none" stroke="#c7473a" stroke-width="2"/>
  <path d="M510 115 L522 121 L510 127" fill="none" stroke="#c7473a" stroke-width="2"/>
  <rect x="522" y="91" width="90" height="60" rx="10" fill="#fff7f5" stroke="#eccbc6"/>
  <text class="h" x="567" y="116" text-anchor="middle" fill="#9f3329">429</text>
  <text class="s" x="567" y="137" text-anchor="middle">한도 초과</text>

  <rect x="290" y="208" width="322" height="54" rx="10" fill="#f7f7f9"/>
  <text class="t" x="310" y="232">배치에 사용할 수 있는 용량</text>
  <text class="h" x="310" y="251">전체 한도 − 현재 운영 트래픽</text>
</svg>
